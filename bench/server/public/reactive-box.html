<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Reactive attr — box</title>
  <link rel="stylesheet" href="/public/style.css">
</head>
<body>
  <p>box: <code>class={tone}</code> + 텍스트 <code>{label}</code>. set으로 class/텍스트가 각각 바뀌는지 확인.</p>
  <div id="c1"></div>
  <p>
    <button id="t-warn">set(0, 'warn')</button>
    <button id="t-ok">set(0, 'ok')</button>
    <button id="l">set(1, '변경됨')</button>
  </p>
  <script type="module">
    // box: props { tone, label } → div(class={tone}) { "상태: " {label} }
    // store={tone:'ok', label:'정상'}. offset0=tone→leaf0(class), offset1=label→leaf1(텍스트).
    // set(0,'warn')은 div의 class를, set(1,..)은 텍스트를 바꾼다 — 속성·텍스트가 같은 모델로 반응.
    import { createComponent, set } from "/reactive.js";

    const res = await fetch("/components/box.qubb");
    const bytes = new Uint8Array(await res.arrayBuffer());

    const store = { tone: 'ok', label: '정상' };
    const render = createComponent(bytes, 0);
    document.getElementById("c1").replaceChildren(render(store, ['tone', 'label']));

    document.getElementById("t-warn").onclick = () => set(0, 'warn');
    document.getElementById("t-ok").onclick = () => set(0, 'ok');
    document.getElementById("l").onclick = () => set(1, '변경됨');
    window.set = set; // 콘솔에서 직접 호출
  </script>
</body>
</html>
