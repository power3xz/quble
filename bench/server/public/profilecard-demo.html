<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>quble CSR — ProfileCard ×5</title>
    <link rel="stylesheet" href="/public/style.css"></head>
  </head>
  <body>
    <div id="root" class="cards"></div>

    <script type="module">
      import { compile, createLeafStoreSubject } from "/runtime.js";

      // profilecard.qubb + resmap(LOAD_RES가 resmap[resId] URL로 <link> 삽입 → CSS도 클라가 로드).
      const bytes = new Uint8Array(
        await (await fetch("/components/profilecard.qubb")).arrayBuffer(),
      );
      const resmap = await (await fetch("/resmap/profilecard")).json();
      const blueprintOf = compile(bytes, resmap);

      // paths = profilecard.qubc props 선언 순서. 각 사람의 값을 이 순서로 배열화한다.
      const paths = [
        "name",
        "role",
        "bio",
        "avatar",
        "link",
        "theme",
        "followersLabel",
        "followers",

        "postsLabel",
        "posts",

        "location",

        "act1Time",
        "act2Icon",
        "act2Text",
        "act2Time",
        "act3Icon",
        "act3Text",
        "act3Time",
        "tag1",
        "tag2",
        "tag3",
        "tag4",

      const common = {

      };
      const people = [
        {

          act3Text: "반응성 모델 논의",
          tag1: "rust",
          tag2: "compiler",
          tag3: "wasm",
          tag4: "ssr",
        },
        {
          name: "이비",
          role: "디자이너",
          bio: "타이포그래피와 여백에 진심입니다. 손에 잡히는 디테일을 좋아합니다.",
          avatar: "/img/b",
          link: "/u/b",
          theme: "dark",
          followers: "3.4k",
          following: "210",
          posts: "128",
          location: "부산",
          company: "Studio B",
          site: "/s/b",
          github: "/gh/b",
          twitter: "/tw/b",
          act1Text: "디자인 시스템 v2 공개",
          act2Text: "아이콘 세트 업데이트",

          avatar: "/img/c",
          link: "/u/c",

          act2Text: "지표 대시보드 개편",
          act3Text: "사용자 인터뷰 10건",

        {

          tag3: "dom",
          tag4: "perf",
        },
      ];

      // 초기 렌더 성능 — 같은 5명을 200번 반복해 1000장을 그린다. (/react/Perf·/svelte/Perf와 동일 축)
      const REPEAT = 200;
      const root = document.getElementById("root");
      const start = performance.now();
      for (let r = 0; r < REPEAT; r++) {
        for (const person of people) {
          const merged = { ...common, ...person };
          // 값은 store가 들고, blueprint엔 paths(키 이름)를 넘긴다 — runtime이 scope offset을
          // paths[offset]로 풀어 ctx에서 resolve한다(dashboard-demo와 동일).
          const ctx = createLeafStoreSubject(merged);
          const inst = blueprintOf(0)(ctx, paths);
          root.append(...inst.nodes);
        }
      }
      const elapsed = performance.now() - start;
      const log = document.createElement("pre");
      log.id = "log";
      log.textContent = `quble: ${people.length * REPEAT}장 초기 렌더 ${elapsed.toFixed(1)}ms`;
      document.body.prepend(log);
    </script>
  </body>
</html>
