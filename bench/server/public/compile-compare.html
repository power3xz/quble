<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>compile.js vs reactive.js 비교 (product)</title>
  <link rel="stylesheet" href="/public/style.css">
  <style>
    .cols { display: flex; gap: 24px; }
    .col { flex: 1; border: 1px solid #ddd; border-radius: 8px; padding: 12px; }
    .col h2 { margin-top: 0; font-size: 14px; color: #555; }
  </style>
</head>
<body>
  <p>같은 product.qubb를 <b>reactive.js</b>와 <b>compile.js</b>로 각각 렌더. 같은 store 갱신에
     둘 다 동일하게 반응하면 compile.js가 reactive.js와 동치(합성·공유·반응성).</p>
  <div class="cols">
    <div class="col"><h2>reactive.js</h2><div id="root-reactive"></div></div>
    <div class="col"><h2>compile.js</h2><div id="root-compile"></div></div>
  </div>
  <p>
    <button id="bump-price">가격 +100 (공유: 배지·버튼)</button>
    <button id="rename">이름 변경 (제목만)</button>
  </p>

  <script type="module">
    import { createComponent, createStore as storeR } from "/reactive.js";
    import { compile, createStore as storeC } from "/compile.js";

    const res = await fetch("/components/product.qubb");
    const bytes = new Uint8Array(await res.arrayBuffer());
    const paths = ["name", "price"];
    const initial = { name: "연필", price: 500 };

    // reactive.js: createComponent → render(ctx, paths) → fragment
    const ctxR = storeR({ ...initial });
    const render = createComponent(bytes, 0);
    document.getElementById("root-reactive").replaceChildren(render(ctxR, paths));

    // compile.js: compile → get(0) → blueprint(ctx, paths) → { nodes }
    const ctxC = storeC({ ...initial });
    const blueprintOf = compile(bytes);
    const inst = blueprintOf(0)(ctxC, paths);
    document.getElementById("root-compile").replaceChildren(...inst.nodes);

    // 두 store를 같은 버튼으로 동시에 갱신 → 양쪽이 동일하게 바뀌어야 한다.
    let price = 500;
    let n = 0;
    document.getElementById("bump-price").onclick = () => {
      price += 100;
      ctxR.set(1, price);
      ctxC.set(1, price);
    };
    document.getElementById("rename").onclick = () => {
      const name = ["지우개", "자", "풀"][n++ % 3];
      ctxR.set(0, name);
      ctxC.set(0, name);
    };

    // 콘솔에서 호출: measure() 또는 measure(100000). compile.js 단독 인스턴스화 µs/instance 측정.
    // store는 공유(resolve 캐시 후 동일), 노드는 detached. 워밍업 후 성능 측정.
    window.measure = (N = 50000, warmup = 2000) => {
      const ctx = storeC({ ...initial });
      for (let i = 0; i < warmup; i++) {
        blueprintOf(0)(ctx, paths);
      }
      const t0 = performance.now();
      for (let i = 0; i < N; i++) {
        blueprintOf(0)(ctx, paths);
      }
      const ms = performance.now() - t0;
      console.log(`N=${N.toLocaleString()}: ${ms.toFixed(1)} ms  (${(ms * 1000 / N).toFixed(3)} µs/instance)`);
      return ms * 1000 / N;
    };
    console.log("measure(N) 준비됨 — 콘솔에서 measure() 또는 measure(100000) 호출");
  </script>
</body>
</html>
