<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>qubb inspector</title>
  <link rel="stylesheet" href="/public/inspector.css">
</head>
<body>
  <div class="inspector">
    <header class="inspector__header">
      <span class="inspector__logo">Q</span>
      <span class="inspector__title">qubb inspector <span class="inspector__title-sub">— qubc 디컴파일러</span></span>
    </header>

    <div class="inspector__body">
      <aside class="inspector__sidebar">
        <div class="inspector__field">
          <label class="inspector__label" for="qubb">qubb</label>
          <select class="inspector__select" id="qubb"></select>
        </div>
        <div class="inspector__field">
          <label class="inspector__label" for="url">qubb url</label>
          <div class="inspector__url">
            <input class="inspector__url-input" id="url" type="text" placeholder="https://.../card.qubb">
            <button class="inspector__url-load" id="url-load">load</button>
          </div>
        </div>
        <div class="inspector__meta" id="meta"></div>
        <ul class="inspector__list" id="list"></ul>
        <div class="inspector__reslist" id="reslist"></div>
      </aside>

      <main class="inspector__view">
        <div class="inspector__pane">
          <details class="inspector__panel inspector__pool" id="pool">
            <summary class="inspector__panel-title inspector__pool-summary" id="pool-summary">constant pool</summary>
            <div class="inspector__pool-body" id="pool-body"></div>
          </details>
          <div class="inspector__panel">
            <div class="inspector__panel-title" id="src-title">qubc</div>
            <div class="inspector__compmeta" id="compmeta"></div>
            <pre class="inspector__source inspector__source--empty" id="src">왼쪽에서 컴포넌트를 선택하세요.</pre>
          </div>
          <details class="inspector__panel">
            <summary class="inspector__panel-title">contexts</summary>
            <div class="inspector__contexts" id="contexts">
              <p class="inspector__placeholder">컴포넌트를 선택하면 @with 컨텍스트가 표시됩니다.</p>
            </div>
          </details>
          <div class="inspector__panel">
            <div class="inspector__panel-title">events</div>
            <div class="inspector__events" id="events">
              <p class="inspector__placeholder">컴포넌트를 선택하면 발사 이벤트가 표시됩니다.</p>
            </div>
          </div>
          <div class="inspector__controls">
            <div class="inspector__panel-title">arguments</div>
            <div class="inspector__args" id="args">
              <p class="inspector__placeholder">컴포넌트를 선택하면 arg 입력이 표시됩니다.</p>
            </div>
          </div>
        </div>
        <div class="inspector__viewer">
          <div class="inspector__panel-title">preview</div>
          <div class="inspector__stage" id="stage">
            <p class="inspector__placeholder">미리보기는 다음 단계에서 연결됩니다.</p>
          </div>
          <div class="inspector__panel-title inspector__log-title">
            event log
            <button class="inspector__log-clear" id="log-clear">clear</button>
          </div>
          <div class="inspector__log" id="log">
            <p class="inspector__placeholder">이벤트를 발생시키면 여기에 기록됩니다.</p>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script type="module">
    import { inspect, decompileComponent, componentArgs, collectEventFullnames } from "/disasm.js";
    import { compile, createLeafStoreSubject } from "/runtime.js";

    const qubbSelect = document.getElementById("qubb");
    const urlInput = document.getElementById("url");
    const urlLoad = document.getElementById("url-load");
    const list = document.getElementById("list");
    const src = document.getElementById("src");
    const meta = document.getElementById("meta");
    const argsBox = document.getElementById("args");
    const stage = document.getElementById("stage");
    const reslist = document.getElementById("reslist");
    const srcTitle = document.getElementById("src-title");
    const poolBody = document.getElementById("pool-body");
    const poolSummary = document.getElementById("pool-summary");
    const compmeta = document.getElementById("compmeta");
    const contextsPanel = document.getElementById("contexts");
    const eventsPanel = document.getElementById("events");
    const log = document.getElementById("log");
    const logClear = document.getElementById("log-clear");

    // HTML 이스케이프 — 토큰 텍스트를 innerHTML에 넣기 전에 적용.
    const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const span = (cls, text) => `<span class="tok-${cls}">${esc(text)}</span>`;

    // qubc 하이라이트 — 우리 문법 토큰을 <span>으로. 매칭 안 된 텍스트는 이스케이프만.
    // 토큰: 문자열 "...", 변수 {arg}, 키워드, 디렉티브 @if/@for, 컴포넌트명(대문자 시작).
    const QUBC_KEYWORDS = new Set(["component", "props", "template", "use", "from"]);
    const highlightQubc = (text) => {
      // 교대 매칭: 문자열 | 변수 | 디렉티브 | 식별자. 나머지(기호·공백)는 그대로.
      // 변수는 {arg}처럼 공백 없는 단일 식별자만 — 블록 구분자 `{`(뒤에 공백)와 구별된다.
      const re = /("[^"]*")|(\{[A-Za-z_]\w*\})|(@\w+)|([A-Za-z_]\w*)/g;
      let out = "";
      let last = 0;
      let m;
      while ((m = re.exec(text)) !== null) {
        out += esc(text.slice(last, m.index));
        if (m[1]) {
          out += span("string", m[1]);
        } else if (m[2]) {
          out += span("var", m[2]);
        } else if (m[3]) {
          out += span("directive", m[3]);
        } else {
          const word = m[4];
          if (QUBC_KEYWORDS.has(word)) {
            out += span("keyword", word);
          } else if (/^[A-Z]/.test(word)) {
            out += span("type", word); // 컴포넌트명
          } else {
            out += esc(word);
          }
        }
        last = re.lastIndex;
      }
      out += esc(text.slice(last));
      return out;
    };

    // css 하이라이트 — 거친 토큰(주석·셀렉터·속성·값). 완전 파싱이 아니라 색칠용이라
    // 엣지에서 색이 어긋나도 안전(내용은 그대로). 주석 우선, 그다음 셀렉터{본문} 블록.
    const highlightCss = (text) => {
      const re = /(\/\*[\s\S]*?\*\/)|([^{}]+)(\{)([^}]*)(\})/g;
      let out = "";
      let last = 0;
      let m;
      while ((m = re.exec(text)) !== null) {
        out += esc(text.slice(last, m.index));
        if (m[1]) {
          out += span("comment", m[1]);
        } else {
          // 셀렉터 { 속성: 값; ... }
          out += span("selector", m[2]) + esc(m[3]);
          // 본문은 `prop: value;` 단위로 — prop만 칠하고 값은 그대로.
          out += m[4].replace(/([\w-]+)(\s*:)/g, (_, prop, colon) => span("prop", prop) + colon);
          out += esc(m[5]);
        }
        last = re.lastIndex;
      }
      out += esc(text.slice(last));
      return out;
    };

    let module = null;
    let blueprintOf = null; // 현재 qubb의 컴파일된 blueprint 팩토리.
    let currentArgs = []; // [{ name, type }] — 현재 컴포넌트의 arg 스펙.
    let ctx = null; // 현재 프리뷰 인스턴스의 store(반응 갱신 대상).
    let leafOf = {}; // argName -> leafIndex. set 대상(string·bool만 의미 있음).
    let currentResmap = []; // 현재 qubb의 resId -> 원본 경로(res/...). 디컴파일 use·사이드바 표시용.
    let currentResolvedResmap = []; // resId -> qubb origin 기준 절대 URL. runtime <link>·fetch용.

    // 서버 적재 컴포넌트(select)를 연다 — /components/<name>.qubb + /resmap/<name>.
    const loadByName = (name) => loadQubb("/components/" + name + ".qubb", "/resmap/" + name);

    // 임의 qubb URL을 연다. resmap은 같은 경로에서 확장자만 바꾼다(우리 산출물 규칙):
    // ".../card.qubb" -> ".../card.resmap.json". (다른 확장자면 뒤에 그냥 붙인다.)
    const loadByUrl = (qubbUrl) => {
      const resmapUrl = qubbUrl.replace(/\.qubb$/, "") + ".resmap.json";
      return loadQubb(qubbUrl, resmapUrl);
    };

    // qubbUrl·resmapUrl로 fetch해 디코드하고, 안에 든 컴포넌트들을 목록으로 그린다.
    // resmap fetch 실패(없는 서버)는 빈 배열로 폴백 — 리소스 로드 없이 디컴파일·프리뷰만.
    const loadQubb = async (qubbUrl, resmapUrl) => {
      const res = await fetch(qubbUrl);
      const bytes = new Uint8Array(await res.arrayBuffer());
      const result = inspect(bytes);
      module = result.module;
      // 리소스맵(resId -> 경로)을 받는다. 표시·디컴파일엔 원본 경로(`res/...`)를 그대로 쓰고,
      // runtime <link>·fetch엔 qubb URL을 base로 절대화한 것을 쓴다 — custom url로 로드한 경우
      // 리소스도 그 origin에서 받아와야 하기 때문.
      currentResmap = await fetch(resmapUrl).then((r) => (r.ok ? r.json() : [])).catch(() => []);
      const qubbBase = new URL(qubbUrl, location.href);
      currentResolvedResmap = currentResmap.map((path) => new URL(path, qubbBase).href);
      blueprintOf = compile(bytes, currentResolvedResmap);
      meta.textContent = `${result.components.length}개 컴포넌트 · ${module.pool.length} pool · ${bytes.length} bytes`;
      renderPool(module.pool, module.poolBytes);
      list.replaceChildren();
      // 사이드바 컴포넌트 목록 아래에 이 qubb의 리소스(resId -> href)를 나열.
      reslist.replaceChildren();
      if (currentResmap.length > 0) {
        const title = document.createElement("div");
        title.className = "inspector__reslist-title";
        title.textContent = "resources";
        reslist.appendChild(title);
        currentResmap.forEach((href, resId) => {
          const item = document.createElement("div");
          item.className = "inspector__res";
          item.innerHTML = `<span class="inspector__item-id">${resId}</span>${href}`;
          // 표시는 원본 경로, fetch는 절대화한 URL.
          item.onclick = () => showResource(currentResolvedResmap[resId], item);
          reslist.appendChild(item);
        });
      }
      for (const comp of result.components) {
        const li = document.createElement("li");
        li.className = "inspector__item";
        li.innerHTML = `<span class="inspector__item-id">${comp.compId}</span>${comp.name}`;
        li.onclick = () => select(comp.compId, li);
        list.appendChild(li);
      }
      if (result.components.length > 0) {
        select(0, list.firstChild);
      }
    };

    // 입력 필드의 현재 값을 타입에 맞게 읽는다.
    const readInput = (arg) => {
      const input = argsBox.querySelector(`[data-arg="${arg.name}"]`);
      if (arg.type === "bool") {
        return input.checked;
      }
      if (arg.type === "number") {
        return Number(input.value);
      }
      return input.value;
    };

    // 리소스를 클릭하면 qubc 패널 자리에 그 CSS 내용을 보여준다(href를 fetch).
    const showResource = async (href, item) => {
      for (const el of reslist.querySelectorAll(".inspector__res")) {
        el.classList.remove("inspector__res--active");
      }
      item.classList.add("inspector__res--active");
      // 컴포넌트 선택 강조는 해제 — 지금 보는 건 컴포넌트가 아니라 리소스다.
      for (const el of list.children) {
        el.classList.remove("inspector__item--active");
      }
      srcTitle.textContent = "css";
      compmeta.innerHTML = ""; // 리소스 뷰엔 컴포넌트 메타 없음
      src.classList.remove("inspector__source--empty");
      src.textContent = "불러오는 중…";
      const css = await (await fetch(href)).text();
      src.innerHTML = highlightCss(css);
    };

    // 이 qubb의 상수풀을 qubc 패널 위 패널에 인덱스와 함께 나열(BYTECODE.md §2). 제목에 직렬화 바이트.
    const renderPool = (pool, poolBytes) => {
      poolSummary.textContent = `constant pool · ${poolBytes}B`;
      poolBody.innerHTML = pool
        .map((v, i) => `<div class="inspector__grow"><span class="inspector__item-id">${i}</span>${esc(v)}</div>`)
        .join("");
    };

    // 선택한 컴포넌트의 메타를 qubc 패널 위에 배지로 — 코드 오프셋·크기. 이벤트는 별도 패널
    // (renderEvents)에서 fullname으로 보여준다.
    const renderCompMeta = (compId) => {
      const def = module.defs[compId];
      compmeta.innerHTML = [
        `<span class="inspector__badge">id ${compId}</span>`,
        `<span class="inspector__badge">code @${def.codeOff} · ${def.codeLen}B</span>`,
      ].join("");
    };

    // 필드 한 줄: 이름 + 출처. 출처는 리터럴이면 그 상수값(따옴표+강조), 변수면 루트 arg{N}(중립).
    // events·contexts가 공유한다(둘 다 같은 fields 인코딩).
    const fieldRow = (name, isLit, text) => {
      const source = isLit
        ? `<span class="inspector__event-field-source inspector__event-field-source--literal">"${esc(text)}"</span>`
        : `<span class="inspector__event-field-source inspector__event-field-source--arg">${esc(text)}</span>`;
      return `<li class="inspector__event-field"><span class="inspector__event-field-name">${esc(name)}</span>${source}</li>`;
    };

    // 컨텍스트 패널 — 이 컴포넌트가 선언한 @with 컨텍스트를 이름별로, 필드 출처와 함께 보여준다.
    // 필드 값은 리터럴("값") 또는 이 컴포넌트 prop 참조(arg{index}).
    const renderContexts = (compId) => {
      const contexts = module.defs[compId].contexts;
      if (contexts.length === 0) {
        contextsPanel.innerHTML = '<p class="inspector__placeholder">이 컴포넌트는 컨텍스트가 없습니다.</p>';
        return;
      }
      contextsPanel.innerHTML = contexts
        .map((ctx) => {
          const fields = ctx.fields
            .map((f) => fieldRow(module.pool[f.nameConstIndex], f.isConst, f.isConst ? module.pool[f.index] : `arg${f.index}`))
            .join("");
          return (
            `<div class="inspector__event">` +
            `<div class="inspector__event-name">${esc(module.pool[ctx.nameConstIndex])}</div>` +
            (fields ? `<ul class="inspector__event-fields">${fields}</ul>` : "") +
            `</div>`
          );
        })
        .join("");
    };

    // 이벤트 패널 — 이 컴포넌트를 루트로 쓸 때 합성 트리에서 발사되는 이벤트를 fullname으로 보여준다.
    // 합성 자식의 이벤트는 type-name이 누적된 fullname(Toggle.TOGGLE)으로, payload 필드와 참조 offset도.
    // 이벤트 이름 옆에 발사 시점 활성 @with 컨텍스트(누적, 안쪽 우선)를 배지로 표시한다.
    const renderEvents = (compId) => {
      const events = collectEventFullnames(module, compId);
      if (events.length === 0) {
        eventsPanel.innerHTML = '<p class="inspector__placeholder">이 컴포넌트는 이벤트를 발사하지 않습니다.</p>';
        return;
      }
      eventsPanel.innerHTML = events
        .map((event) => {
          const fields = event.payload
            .map((p) => fieldRow(p.field, p.source.kind === "lit", p.source.kind === "lit" ? p.source.value : `arg${p.source.offset}`))
            .join("");
          const withTags = event.contexts.length > 0
            ? `<span class="inspector__event-with">@with ${event.contexts.map(esc).join(", ")}</span>`
            : "";
          return (
            `<div class="inspector__event">` +
            `<div class="inspector__event-name">${esc(event.fullname)}${withTags}</div>` +
            (fields ? `<ul class="inspector__event-fields">${fields}</ul>` : "") +
            `</div>`
          );
        })
        .join("");
    };

    // 한 컴포넌트를 선택한다 — qubc 표시 + arg 입력 UI 생성 + 프리뷰 마운트.
    const select = (compId, li) => {
      for (const el of list.children) {
        el.classList.remove("inspector__item--active");
      }
      // 리소스 뷰에서 컴포넌트로 돌아오면 리소스 강조 해제 + 타이틀 복귀.
      for (const el of reslist.querySelectorAll(".inspector__res")) {
        el.classList.remove("inspector__res--active");
      }
      li.classList.add("inspector__item--active");
      srcTitle.textContent = "qubc";
      src.classList.remove("inspector__source--empty");
      src.innerHTML = highlightQubc(decompileComponent(module, compId, currentResmap));
      renderCompMeta(compId);
      renderContexts(compId);
      renderEvents(compId);

      currentArgs = componentArgs(module, compId);
      buildArgInputs();
      mountPreview(compId);
    };

    // 현재 컴포넌트의 arg 입력 필드를 만든다 — 타입별로 체크박스/숫자/텍스트.
    // string·bool 변경은 set으로 반응 갱신, number(for count)는 첫 렌더만 반영(런타임 미완).
    const buildArgInputs = () => {
      argsBox.replaceChildren();
      if (currentArgs.length === 0) {
        argsBox.innerHTML = '<p class="inspector__placeholder">이 컴포넌트는 arg가 없습니다.</p>';
        return;
      }
      for (const arg of currentArgs) {
        const row = document.createElement("label");
        row.className = "inspector__arg";
        const name = document.createElement("span");
        name.className = "inspector__arg-name";
        name.textContent = `${arg.name} : ${arg.type}`;
        if (arg.type === "number") {
          name.textContent += " (첫 렌더만)";
        }
        const input = document.createElement("input");
        input.dataset.arg = arg.name;
        if (arg.type === "bool") {
          input.type = "checkbox";
          input.checked = true;
        } else if (arg.type === "number") {
          input.type = "number";
          input.value = "3";
          input.min = "0";
        } else {
          input.type = "text";
          input.value = arg.name;
        }
        input.className = "inspector__arg-input";
        // number(for)는 set이 반영 안 되니 입력에 갱신을 걸지 않는다(첫 렌더만).
        if (arg.type !== "number") {
          input.oninput = () => ctx.set(leafOf[arg.name], readInput(arg));
        }
        row.append(name, input);
        argsBox.appendChild(row);
      }
    };

    // 이벤트 로그 — 발생 시각·이벤트명·data·context를 로그 패널에 한 줄씩 쌓는다(위->아래, 최신이 맨 아래).
    const logEvent = (eventName, data, context) => {
      if (log.querySelector(".inspector__placeholder")) {
        log.replaceChildren();
      }
      const row = document.createElement("div");
      row.className = "inspector__log-row";
      const time = new Date().toLocaleTimeString("en-GB", { hour12: false });
      row.innerHTML =
        `<span class="inspector__log-time">${time}</span>` +
        `<span class="inspector__log-name">${esc(eventName)}</span>` +
        `<span class="inspector__log-data">${esc(JSON.stringify(data))}</span>` +
        `<span class="inspector__log-context">${esc(JSON.stringify(context))}</span>`;
      log.appendChild(row);
      log.scrollTop = log.scrollHeight; // 최신 줄이 보이게 바닥으로
    };

    // 루트 컴포넌트에서 합성 트리를 걸어 발사 가능한 fullname마다 로그 핸들러를 건다. runtime이
    // 이벤트를 fullname("Toggle.TOGGLE")으로 디스패치하므로 핸들러도 fullname으로 걸어야 잡힌다.
    const buildLogHandlers = (compId) => {
      const handlers = {};
      for (const event of collectEventFullnames(module, compId)) {
        handlers[event.fullname] = (data, { context }) => logEvent(event.fullname, data, context);
      }
      return handlers;
    };

    // 현재 입력값으로 store를 만들고 컴포넌트를 한 번 인스턴스화해 stage에 부착한다.
    // 이후 string·bool 변경은 ctx.set으로 leaf만 갱신한다(재빌드 없음). paths는 arg 이름을
    // 그대로 store 경로로 쓰고, resolve로 argName -> leafIndex를 확보해 set 대상을 잡는다.
    const mountPreview = (compId) => {
      const values = {};
      const paths = [];
      for (const arg of currentArgs) {
        values[arg.name] = readInput(arg);
        paths.push(arg.name);
      }
      ctx = createLeafStoreSubject(values);
      const inst = blueprintOf(compId)(ctx, paths, buildLogHandlers(compId));
      stage.replaceChildren(...inst.nodes);
      // 인스턴스화 중 쓰인 arg는 pathCache에 leafIndex가 잡혔다. resolve로 그 인덱스를 받아둔다.
      leafOf = {};
      for (const arg of currentArgs) {
        leafOf[arg.name] = ctx.leafOf(arg.name);
      }
    };

    logClear.onclick = () => {
      log.innerHTML = '<p class="inspector__placeholder">이벤트를 발생시키면 여기에 기록됩니다.</p>';
    };

    qubbSelect.onchange = () => loadByName(qubbSelect.value);

    // URL 입력으로 임의 qubb를 연다(서버 목록 밖). resmap은 같은 경로 규칙으로 유도.
    urlLoad.onclick = () => {
      const url = urlInput.value.trim();
      if (url) {
        loadByUrl(url);
      }
    };
    urlInput.onkeydown = (e) => {
      if (e.key === "Enter") {
        urlLoad.onclick();
      }
    };

    // 적재 컴포넌트 목록을 서버에서 받아 셀렉트박스를 채우고 첫 항목을 연다.
    const names = await (await fetch("/components")).json();
    for (const name of names) {
      const opt = document.createElement("option");
      opt.value = name;
      opt.textContent = name + ".qubb";
      qubbSelect.appendChild(opt);
    }
    if (names.length > 0) {
      loadByName(names[0]);
    }
  </script>
</body>
</html>
