<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Quble @if swap — 무거운 가지 (heavyif)</title>
  <link rel="stylesheet" href="/public/style.css">
</head>
<body>
  <h3>Quble @if swap — 무거운 가지 1000행 (runtime.js)</h3>
  <p>heavyif.qubb를 runtime.js로 렌더. then=sharedA(초록), else=sharedB(빨강). swap하면 색·숫자가 바뀐다.
     세 벤치: swap(show 토글) / set(보이는 가지 값++) / build(인스턴스화).</p>
  <p>
    <button id="bench-swap">swap(show) ×100</button>
    <button id="bench-set">set(보이는 값) ×100</button>
    <button id="bench-build">build ×100</button>
    <button id="manual">수동 토글(눈으로 확인)</button>
  </p>
  <pre id="log">준비됨 — 버튼을 눌러 측정.</pre>
  <div id="root"></div>

  <script type="module">
    import { compile, createLeafStoreSubject } from "/runtime.js";

    const res = await fetch("/components/heavyif.qubb");
    const bytes = new Uint8Array(await res.arrayBuffer());
    const ROWS = 1000;

    const paths = ["show", "sharedA", "sharedB"];
    const ctx = createLeafStoreSubject({ show: true, sharedA: 0, sharedB: 0 });

    const blueprintOf = compile(bytes);
    const inst = blueprintOf(0)(ctx, paths);
    const root = document.getElementById("root");
    root.replaceChildren(...inst.nodes);

    const showLeaf = ctx.leafOf("show");
    const aLeaf = ctx.leafOf("sharedA");
    const bLeaf = ctx.leafOf("sharedB");

    const log = (line) => {
      document.getElementById("log").textContent += "\n" + line;
    };

    let show = true; // 모든 핸들러가 공유하는 단일 상태
    let a = 0;
    let b = 0;

    document.getElementById("bench-swap").onclick = () => {
      const runs = 101; // 홀수 — 끝나고 가지가 바뀐 채로 남아 화면에서 swap이 보인다
      for (let i = 0; i < 10; i++) { show = !show; ctx.set(showLeaf, show); }
      const start = performance.now();
      for (let i = 0; i < runs; i++) { show = !show; ctx.set(showLeaf, show); }
      const end = performance.now();
      log(`swap(show) ${runs}회: 평균 ${((end - start) / runs).toFixed(4)}ms (총 ${(end - start).toFixed(1)}ms)`);
    };

    document.getElementById("bench-set").onclick = () => {
      const runs = 100;
      // 현재 보이는 가지의 값만 증가 (안 보이는 가지는 구독 0이라 영향 없음)
      const leaf = show ? aLeaf : bLeaf;
      for (let i = 0; i < 10; i++) { ctx.set(leaf, show ? ++a : ++b); }
      const start = performance.now();
      for (let i = 0; i < runs; i++) { ctx.set(leaf, show ? ++a : ++b); }
      const end = performance.now();
      log(`set(보이는 가지 ${ROWS}행) ${runs}회: 평균 ${((end - start) / runs).toFixed(4)}ms (총 ${(end - start).toFixed(1)}ms)`);
    };

    document.getElementById("bench-build").onclick = () => {
      const runs = 100;
      // 매번 새 인스턴스화(양쪽 가지 다 build). detached — 부착 안 함.
      const tmp = createLeafStoreSubject({ show: true, sharedA: 0, sharedB: 0 });
      for (let i = 0; i < 10; i++) { blueprintOf(0)(tmp, paths); }
      const start = performance.now();
      for (let i = 0; i < runs; i++) { blueprintOf(0)(tmp, paths); }
      const end = performance.now();
      log(`build(인스턴스화, 양쪽 ${ROWS}행) ${runs}회: 평균 ${((end - start) / runs).toFixed(4)}ms (총 ${(end - start).toFixed(1)}ms)`);
    };

    document.getElementById("manual").onclick = () => {
      show = !show;
      if (show) { ctx.set(aLeaf, ++a); } else { ctx.set(bLeaf, ++b); }
      ctx.set(showLeaf, show);
    };

    window.inst = inst;
  </script>
</body>
</html>
