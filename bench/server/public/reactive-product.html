<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Reactive — 합성 (product)</title>
  <link rel="stylesheet" href="/public/style.css">
</head>
<body>
  <p>ProductCard가 PriceTag·BuyButton을 합성. 둘 다 부모의 <code>price</code>를 받는다(같은 path).
     set(price)이 배지·버튼을 함께 갱신하고(공유), set(name)은 제목만 바꾸는지 확인.</p>
  <div id="root"></div>
  <p>
    <button id="bump-price">가격 +100</button>
    <button id="rename">이름 변경</button>
  </p>
  <script type="module">
    // ProductCard(comp_id 0): props { name, price } → name=path 'name', price=path 'price'.
    // 내부 PUSH_ARG가 'price'를 PriceTag·BuyButton 둘에 넘긴다 → 둘 다 같은 leafIndex로 resolve(공유).
    // set으로 그 leaf를 갱신하면 배지·버튼이 함께 바뀐다.
    import { createComponent, createStore } from "/reactive.js";

    const res = await fetch("/components/product.qubb");
    const bytes = new Uint8Array(await res.arrayBuffer());

    const ctx = createStore({ name: '연필', price: 500 });
    const render = createComponent(bytes, 0);
    document.getElementById("root").replaceChildren(render(ctx, ['name', 'price'])); // name=leaf0, price=leaf1

    let price = 500, n = 0;
    document.getElementById("bump-price").onclick = () => ctx.set(1, (price += 100)); // PriceTag·BuyButton 공유
    document.getElementById("rename").onclick = () => ctx.set(0, ['지우개', '자', '풀'][n++ % 3]); // 제목만
    window.set = ctx.set;
  </script>
</body>
</html>
