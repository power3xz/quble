<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>Quble 앱 구동</title>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { mount } from "/mount.js";

    // 배포된 settingspanel을 이름 data로 마운트한다. build -> 배포(/dist) -> 구동의 마지막 단계.
    // 초기값은 지금 하드코딩(store/provided 구조가 정해지면 교체 - DESIGN §5.1).
    const data = {
      heading: "설정", dirty: "false", plan: "PRO", docsLink: "#",
      genOpen: "true", genATitle: "알림", genADesc: "푸시 알림 받기", genABadge: "새 기능", genAOn: "true",
      genBTitle: "소리", genBDesc: "효과음 재생", genBBadge: "", genBOn: "false",
      privOpen: "true", privATitle: "위치", privADesc: "위치 공유", privABadge: "", privAOn: "false",
      privBTitle: "추적", privBDesc: "활동 기록", privBBadge: "", privBOn: "true",
      proOpen: "true", proATitle: "고급 분석", proADesc: "상세 리포트", proABadge: "PRO", proAOn: "true",
      proBTitle: "우선 지원", proBDesc: "빠른 응답", proBBadge: "PRO", proBOn: "false",
    };

    await mount("/dist/settingspanel.qubb", document.getElementById("app"), data);
  </script>
</body>
</html>
