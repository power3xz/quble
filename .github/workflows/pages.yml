# playground를 검증하고 GitHub Pages에 배포한다.
# dist/는 gitignore라 산출물이 레포에 없다 - CI가 매번 빌드한다(quble-playground.sh의 1~3단계와 동일).
# 산출 경로는 core/dist/playground 하나뿐이고, 그 안의 자산 참조는 전부 상대경로라
# https://<user>.github.io/quble/ 같은 하위 경로에서도 그대로 뜬다.
name: Pages

# 산출물에 들어가는 것이 바뀔 때만 돈다. 셸/런타임뿐 아니라 컴파일러(qubb와 wasm을 낸다)와
# 빌드 스크립트도 입력이다 - 여기서 빠지면 그쪽을 고쳤을 때 배포가 낡은 채로 남는다.
# 목록에 없는 변경은 workflow_dispatch로 수동 배포한다.
on:
  push:
    branches: [main]
    paths:
      - "core/playground/**"
      - "core/web/**"
      - "core/wasm-compiler/**"
      - "core/build/**"
      - "core/crates/**"
      - "core/Cargo.toml"
      - "core/Cargo.lock"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# 배포는 하나만. 앞선 실행은 취소한다 - deploy-pages가 Pages 서비스 응답을 기다리다 매달리는
# 일이 있어(github-pages 환경의 배포 락), 취소하지 않으면 매달린 실행 뒤로 계속 쌓인다.
# 배포는 아티팩트 통째 교체라 중간에 끊겨도 반쯤 배포된 상태가 남지 않는다.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 배포 전 게이트. playground도 제품이라 검증을 통과한 것만 내보낸다.
  # npm test/typecheck는 core/wasm-compiler/compiler_wasm.wasm을 읽으므로(gitignore라 레포에 없다)
  # build:wasm으로 먼저 채운다 - 이게 없으면 테스트가 아니라 파일 없음으로 죽는다.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: wasm 타겟 추가
        run: rustup target add wasm32-unknown-unknown

      # 레지스트리(~/.cargo)와 빌드 산출물(core/target)을 함께 둔다. 키는 커밋 SHA - 같은
      # 커밋이면 굽는 결과가 같으므로 test가 구운 것을 build가 그대로 받아 다시 안 굽는다.
      # 커밋이 바뀌면 restore-keys가 직전 캐시를 내주고 cargo가 바뀐 크레이트만 다시 굽는다.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-${{ github.sha }}
          restore-keys: cargo-

      - name: 의존성 설치
        run: npm ci

      - name: wasm 빌드 (test/typecheck가 읽는다)
        run: npm run build:wasm --prefix core/wasm-compiler

      # npm test가 fixture를 이 바이너리로 컴파일한다(test-helpers/build.ts). 없으면 전 테스트가 훅에서 죽는다.
      - name: quble 바이너리 빌드 (npm test가 fixture를 이걸로 컴파일한다)
        run: cargo build --manifest-path core/Cargo.toml --bin quble

      - name: cargo test
        run: cargo test --manifest-path core/Cargo.toml --workspace

      - name: npm test
        run: npm test

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: wasm 타겟 추가
        run: rustup target add wasm32-unknown-unknown

      # test와 같은 키 - 같은 커밋이니 그 job이 구운 core/target을 그대로 받아 아래 두
      # cargo build가 재컴파일 없이 끝난다.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: cargo-${{ github.sha }}
          restore-keys: cargo-

      # npm install이 둘이다 - 루트 워크스페이스와
      # core/build(esbuild를 자기 것으로 가진다).
      - name: 의존성 설치
        run: |
          npm ci
          npm ci --prefix core/build

      - name: wasm 컴파일러 빌드
        run: cargo build --manifest-path core/Cargo.toml -p compiler-wasm --target wasm32-unknown-unknown --release

      - name: quble 바이너리 빌드
        run: cargo build --manifest-path core/Cargo.toml --bin quble

      - name: playground 빌드
        run: node build/build-playground.mjs
        working-directory: core

      - uses: actions/upload-pages-artifact@v3
        with:
          path: core/dist/playground

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 성공/실패 모두 Slack으로 알린다. always()라 앞 job이 죽어도 이 job은 돈다 - 안 그러면
  # 정작 실패했을 때 알림이 안 온다. 취소(cancelled)는 결과에서 갈라 표시만 달리한다
  # (배포 concurrency가 앞선 실행을 취소하므로 실패로 보이면 안 된다).
  notify:
    needs: [test, build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Slack 알림
        env:
          WEBHOOK: ${{ secrets.QUBLE_CI_WEBHOOK_URL }}
          # deploy까지 성공해야 success. 앞이 죽으면 뒤는 skipped라 deploy 결과만 봐선 안 된다.
          RESULT: ${{ (needs.test.result == 'success' && needs.build.result == 'success' && needs.deploy.result == 'success') && 'success' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'failure') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          case "$RESULT" in
            success)   ICON=":white_check_mark:"; LABEL="배포 완료" ;;
            cancelled) ICON=":black_square_for_stop:"; LABEL="취소됨" ;;
            *)         ICON=":x:"; LABEL="실패" ;;
          esac
          # 커밋 제목 첫 줄만, JSON 문자열로 안전하게 감싼다(따옴표/줄바꿈이 들어와도 안 깨진다).
          TEXT="$ICON quble CI $LABEL - $(printf '%s' "$SUBJECT" | head -1)"
          jq -n --arg t "$TEXT" --arg url "$RUN_URL" --arg br "$BRANCH" \
            '{text: $t, blocks: [{type:"section", text:{type:"mrkdwn", text: ($t + "\n<" + $url + "|실행 로그> | `" + $br + "`")}}]}' \
            | curl -sS -X POST -H 'Content-type: application/json' --data @- "$WEBHOOK"
