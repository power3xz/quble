[workspace]
resolver = "2"
members = ["crates/bytecode", "crates/compiler", "crates/compiler-wasm", "crates/renderer"]

[package]
name = "quble"
version = "0.0.0"
edition = "2021"
# 기본 실행 바이너리 - `cargo run`(bin 미지정)은 컴파일러를 돌린다(fixture 빌드 등).
default-run = "quble"

[dependencies]
compiler = { path = "crates/compiler" }

# wasm 컴파일러(playground)는 브라우저가 통째로 받으므로 크기가 첫 로딩에 직결된다.
# 아래 셋을 그래서 켰다 - 줄어드는 폭은 strip이 가장 크고 lto+codegen-units=1이 그 다음이다.
#
# opt-level은 기본(3)을 쓴다. 크기 우선("z"/"s")으로 낮추면 컴파일이 몇 배 느려지는데
# gzip 후 크기는 얼마 안 줄어 손해였다.
[profile.release]
lto = true
codegen-units = 1
strip = true
