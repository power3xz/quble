[workspace]
resolver = "2"
# renderer(SSR)는 보류 - 타입화된 상수풀 미대응이라 워크스페이스에서 제외했다(ISSUES.md).
# 크레이트 파일은 SSR 재개 때 복구용으로 남겨둔다. exclude로 두면 `cargo build`가 안 건드린다.
members = ["crates/bytecode", "crates/compiler", "crates/compiler-wasm"]
exclude = ["crates/renderer"]

[package]
name = "quble"
version = "0.0.0"
edition = "2021"
# 기본 실행 바이너리 - `cargo run`(bin 미지정)은 컴파일러를 돌린다(fixture 빌드 등).
default-run = "quble"

[dependencies]
compiler = { path = "crates/compiler" }

# wasm 컴파일러(playground)는 브라우저가 통째로 받으므로 크기가 첫 로딩에 직결된다.
# 205KB -> 172KB (gzip 76 -> 67KB): strip이 -21KB, lto+codegen-units=1이 -12KB.
#
# opt-level은 기본(3)을 쓴다. 크기 우선으로 낮추면 그만큼 컴파일이 느려지는데, 측정해 보니
# 남는 거래가 아니었다 - "z"는 150KB까지 줄지만 컴파일이 2.6배 느리고(0.094 -> 0.240ms)
# 정작 gzip은 6KB밖에 안 준다. "s"도 1.4배 느렸다.
[profile.release]
lto = true
codegen-units = 1
strip = true
