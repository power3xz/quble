<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>quble playground</title>
  <link rel="stylesheet" href="./styles/reset.css">
  <link rel="stylesheet" href="./styles/global.css">
  <style>
    /* 셸과 #preview를 같은 칸에 겹친다. 셸이 화면 전체를 grid로 잡고 오른쪽 위를 비워 두므로,
     * #preview를 같은 자리(오른쪽 위)에 얹으면 그 빈 칸을 채운다. 폭/높이 값은 셸 CSS
     * (components/playground.css의 .pg)가 혼자 정한다 - 여기서 다시 정의하지 않는다. */
    html, body { height: 100%; background: #0d1117; color: #e6e9ef; }
    body { overflow: hidden; }

    .stack { display: grid; height: 100%; }
    /* min-height: 0 - 안 주면 아이템이 내용만큼 늘어 화면을 넘고 스크롤이 페이지에 생긴다.
     * 스크롤은 셸 안(편집 영역/콘솔)에서만 나야 한다. */
    .stack > * { grid-area: 1 / 1; min-height: 0; }

    /* 셸이 비워 둔 오른쪽 위 칸에 맞춘다. 셸의 grid와 같은 트랙을 써야 정확히 포개진다.
     * 값은 components/playground.css의 .pg(--files-w / --head-h / --console-h)와 같아야 한다. */
    .stack__preview {
      display: grid;
      grid-template-columns: 24rem 1fr 1fr;
      grid-template-rows: 4.8rem 1fr 20rem;
      pointer-events: none;
    }
    /* 칸을 차지하고 스크롤을 갖는 자리. 마운트 대상(#preview)과 역할을 나눈다 - 한 요소가
     * 둘을 겸하면 컴포넌트에 줄 높이 기준과 그 컴포넌트의 스크롤이 서로를 막는다. */
    .preview-cell {
      grid-area: 2 / 3;
      /* grid stretch만으로는 height가 auto라 자식의 %가 안 풀린다 - 트랙 높이를 명시로 받는다. */
      height: 100%;
      overflow: auto;
      background: #fff;
      color: #111;
      pointer-events: auto;
    }
    /* 마운트 대상 - 칸 높이를 그대로 물려준다. 자식에게 레이아웃을 강제하지 않는다:
     * 높이를 채울지 말지는 그 컴포넌트의 CSS가 정한다(height: 100%를 쓰면 이 높이가 기준). */
    #preview {
      height: 100%;
    }
    /* 아직 마운트 전이면 배경을 칠하지 않는다 - 흰 칸이 셸의 안내(.pg__guide)를 덮는다. */
    .preview-cell:has(#preview:empty) {
      background: none;
    }
  </style>
</head>
<body>
  <!--
    quble 인스턴스가 둘이다. 서로 모른다.
      #editor  <- 셸(playground.qubb). 빌드 타임에 CLI가 컴파일한다.
      #preview <- 사용자 소스. run 버튼을 눌렀을 때 핸들러가 wasm으로 컴파일해 마운트한다.
  -->
  <div class="stack">
    <div id="editor"></div>
    <div class="stack__preview">
      <div class="preview-cell"><div id="preview"></div></div>
    </div>
  </div>
  <script type="module">
    import { mount } from "./quble-runtime.js";

    // 초기 파일들. 셸이 렌더할 mount 데이터도 여기서 유도한다(한 곳에서만 정의).
    // sources.json은 이름만 담고 내용은 demo/에 실제 파일로 있다 - 데모를 고칠 때 JSON 안의
    // 이스케이프된 문자열이 아니라 그 파일을 편집한다. 목록 순서가 곧 파일 트리 순서다.
    const names = await fetch("./sources.json").then((r) => r.json());
    const sources = await Promise.all(
      names.map(async (name) => ({
        name,
        source: await fetch(`./demo/${name}`).then((r) => r.text()),
      })),
    );

    // 핸들러가 컴파일에 쓸 소스 캐시를 채운다 - 편집 전에도 run이 동작해야 한다.
    // manifest의 handlers는 내용 해시가 붙은 경로라 읽어서 그대로 import한다.
    const manifest = await fetch("./playground.manifest.json").then((r) => r.json());
    const handlers = await import(`./${manifest.handlers}`);
    handlers.seed(sources);

    const data = {
      files: sources.map((f) => ({
        name: f.name,
        isEntry: f.name.endsWith(".qubc"),
        isEditing: false,
        isPreviewing: false,
        hasError: false,
      })),
      editingName: sources[0].name,
      lines: handlers.tokenize(sources[0].source, sources[0].name),
      lineNumbers: handlers.lineNumbersFor(sources[0].source),
      lineCount: handlers.lineCountOf(sources[0].source),
      caretLine: "transform: translateY(1rem)", // 첫 줄 - .pg__view의 padding-top과 같다
      // 줄의 hasError/error는 tokenize가 꺼진 채로 채운다 - 컴파일 에러가 나면 그때 얹힌다.
      previewName: "",
      previewSelected: false,
      logs: [],
      diagnostic: "",
      hasError: false,
    };

    window.__quble = await mount("./playground.qubb", document.getElementById("editor"), data);

    // textarea는 값을 quble이 바인딩하지 않는다(uncontrolled - components/playground.css 참고).
    // 화면은 .pg__view가 그리므로 여기서는 입력용 textarea의 초기 value만 맞춰 준다.
    document.querySelector(".pg__area").value = sources[0].source;

    // 첫 파일을 고른 상태로 시작한다 - 클릭으로 돌려야 핸들러가 그 행의 leafIndex를 받아
    // 강조를 켜고, 다음에 다른 파일을 고를 때 되돌릴 수 있다(부트스트랩은 leafIndex를 모른다).
    document.querySelector(".row__name").click();
  </script>
</body>
</html>
