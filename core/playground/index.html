<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>quble playground</title>
  <link rel="stylesheet" href="./styles/reset.css">
  <link rel="stylesheet" href="./styles/global.css">
<!--qb:styles-->
  <style>
    /* 셸과 #preview를 같은 칸에 겹친다. 셸이 화면 전체를 grid로 잡고 오른쪽 위를 비워 두므로,
     * #preview를 같은 자리(오른쪽 위)에 얹으면 그 빈 칸을 채운다. 폭/높이 값은 셸 CSS
     * (./playground.css의 .pg)가 혼자 정한다 - 여기서 다시 정의하지 않는다. */
    html, body { height: 100%; background: #0d1117; color: #e6e9ef; }
    body { overflow: hidden; }

    .stack { display: grid; height: 100%; }
    /* min-height: 0 - 안 주면 아이템이 내용만큼 늘어 화면을 넘고 스크롤이 페이지에 생긴다.
     * 스크롤은 셸 안(편집 영역/콘솔)에서만 나야 한다. */
    .stack > * { grid-area: 1 / 1; min-height: 0; }

    /* 셸이 비워 둔 오른쪽 위 칸에 맞춘다. 셸의 grid와 같은 트랙을 써야 정확히 포개진다.
     * 값은 ./playground.css의 .pg(--files-w / --head-h / --console-h)와 같아야 한다. */
    .stack__preview {
      display: grid;
      grid-template-columns: 24rem 1fr 1fr;
      grid-template-rows: 4.8rem 1fr 20rem;
      pointer-events: none;
    }
    /* 칸을 차지하고 스크롤을 갖는 자리. 마운트 대상(#preview)과 역할을 나눈다 - 한 요소가
     * 둘을 겸하면 컴포넌트에 줄 높이 기준과 그 컴포넌트의 스크롤이 서로를 막는다. */
    .preview-cell {
      grid-area: 2 / 3;
      /* grid stretch만으로는 height가 auto라 자식의 %가 안 풀린다 - 트랙 높이를 명시로 받는다. */
      height: 100%;
      overflow: auto;
      background: #fff;
      color: #111;
      pointer-events: auto;
    }
    /* 마운트 대상 - 칸 높이를 그대로 물려준다. 자식에게 레이아웃을 강제하지 않는다:
     * 높이를 채울지 말지는 그 컴포넌트의 CSS가 정한다(height: 100%를 쓰면 이 높이가 기준). */
    #preview {
      height: 100%;
    }
    /* 아직 마운트 전이면 배경을 칠하지 않는다 - 흰 칸이 셸의 안내(.pg__guide)를 덮는다. */
    .preview-cell:has(#preview:empty) {
      background: none;
    }
  </style>
</head>
<body>
  <!--
    quble 인스턴스가 둘이다. 서로 모른다.
      #editor  <- 셸(playground.qubb). 빌드 타임에 CLI가 컴파일한다.
      #preview <- 사용자 소스. run 버튼을 눌렀을 때 핸들러가 wasm으로 컴파일해 마운트한다.
  -->
  <div class="stack">
    <div id="editor"><!--qb:editor--></div>
    <div class="stack__preview">
      <div class="preview-cell"><div id="preview"></div></div>
    </div>
  </div>
<!--qb:snapshot-->
  <script type="module">
    import { loadHandlers, resume } from "./quble-runtime.js";

    // 셸은 빌드 때 SSR한 HTML을 스냅샷으로 이어받는다. 초기 파일(sources.json, demo/)은 빌드가 읽어 data로
    // 만들고(initial-data.ts) 그 결과가 스냅샷에 들어 있어, 브라우저는 따로 받지 않는다.
    const snapshot = JSON.parse(document.getElementById("qb-snapshot").textContent);
    const base = new URL("./playground.qubb", location.href);
    const [manifest, bytes] = await Promise.all([
      fetch("./playground.manifest.json").then((r) => r.json()),
      fetch("./playground.qubb").then((r) => r.arrayBuffer()).then((b) => new Uint8Array(b)),
    ]);
    const handlers = await loadHandlers(manifest, base);
    const resources = manifest.resources.map((p) => new URL(p, base).href);
    const editor = document.getElementById("editor");
    window.__quble = resume(bytes, editor, { snapshot, handlers, resources });
  </script>
</body>
</html>
